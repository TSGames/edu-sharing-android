name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Verifies gradlew's checksums against Gradle's known-good list before it runs.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Optional: sign debug builds with a stable, secret-backed keystore instead of AGP's
      # default machine-local one, so a debug APK from this run can be installed over one from
      # a previous run without an uninstall. Secrets aren't available to fork PRs (the env var
      # below resolves empty there), so those builds keep using AGP's default debug key instead
      # -- unstable across runs but still installable standalone. The presence check has to
      # happen inside the shell step (not a step-level `if:`), since Actions disallows
      # referencing `secrets` directly in `if:` conditionals.
      - name: Decode debug keystore
        env:
          EDU_SHARING_DEBUG_STORE_BASE64: ${{ secrets.EDU_SHARING_DEBUG_STORE_BASE64 }}
        run: |
          if [ -n "$EDU_SHARING_DEBUG_STORE_BASE64" ]; then
            echo "$EDU_SHARING_DEBUG_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "EDU_SHARING_DEBUG_STORE_FILE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edu-sharing-android-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: edu-sharing-android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1

      # Unsigned sanity build: catches release-config regressions (proguard/R8, resource
      # shrinking, signingConfig wiring) in CI even though real release signing is manual (see
      # README). signingConfigs.findByName("release") resolves to null with no keystore
      # configured (the case here), so this produces an unsigned APK -- no secrets needed.
      - name: Assemble unsigned release APK (sanity build)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload unsigned release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: edu-sharing-android-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1
